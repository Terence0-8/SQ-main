  <form id="emissionForm" class="workspace">

    <div class="preview-zone">
      <div class="video-preview-card" id="video-container">
        <div class="video-placeholder">L'aperçu vidéo apparaîtra ici</div>
      </div>

      <div class="info-preview">
        <h1 id="preview-title">Titre de l'émission...</h1>
        <p id="preview-desc">La description s'affichera ici.</p>
      </div>
    </div>

    <aside class="settings-right">
      <div class="settings-scroll">

        <h3 class="panel-title">SOURCE</h3>
        <div class="field-group">
          <label>Lien YouTube</label>
          <input type="url" id="video_url" class="sidebar-input" placeholder="https://www.youtube.com/watch?v=..."
            required oninput="updatePreview(this.value)">
        </div>

        <h3 class="panel-title">INFOS</h3>
        <div class="field-group">
          <label>Titre</label>
          <input type="text" id="title" class="sidebar-input" placeholder="Titre de l'émission" required
            oninput="document.getElementById('preview-title').textContent = this.value || 'Titre...'">
        </div>

        <div class="field-group">
          <label>Catégorie</label>
          <select id="category" class="sidebar-input">
            <option>Politique</option>
            <option>Société</option>
            <option>Économie</option>
            <option>Culture</option>
            <option>International</option>
          </select>
        </div>

        <div class="field-group">
          <label>Description</label>
          <textarea id="description" class="sidebar-input" placeholder="Résumé, invités..."
            oninput="document.getElementById('preview-desc').textContent = this.value || 'Description...'"></textarea>
        </div>

        <div class="field-group">
          <label>Durée (Minutes)</label>
          <input type="number" id="duration" class="sidebar-input" placeholder="ex: 45">
        </div>

        <h3 class="panel-title">IMAGE (OPTIONNEL)</h3>
        <div class="field-group">
          <label>Couverture personnalisée</label>
          <input type="file" id="image_file" accept="image/*" class="sidebar-input">
          <small style="color:#888; font-size:0.75rem;">Si vide, on utilise la miniature YouTube.</small>
        </div>

      </div>

      <div class="settings-footer">
        <button type="submit" class="btn-publish">Mettre en ligne</button>
        <div id="status-msg"></div>
      </div>
    </aside>
  </form>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="/js/api.js?v=38"></script>
  <script>
    let editId = null;

    function getYoutubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function updatePreview(url) {
      const id = getYoutubeId(url);
      const container = document.getElementById('video-container');
      if (id) {
        container.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`;
      } else {
        container.innerHTML = `<div class="video-placeholder">Lien invalide</div>`;
      }
    }

    async function maybeLoadEmission() {
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) return;
      editId = id;
      try {
        const res = await fetch(`${window.API_URL}/emissions/${id}?edit=1`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const em = json.emission;
        document.getElementById('video_url').value = em.video_url || '';
        document.getElementById('title').value = em.title || '';
        document.getElementById('description').value = em.description || '';
        document.getElementById('category').value = em.category || 'Politique';
        document.getElementById('duration').value = em.duration_seconds ? Math.round(em.duration_seconds / 60) : '';
        if (em.video_url) updatePreview(em.video_url);
        document.getElementById('preview-title').textContent = em.title || 'Titre...';
        document.getElementById('preview-desc').textContent = em.description || 'Description...';
        document.querySelector('.btn-publish').textContent = 'Mettre à jour';
        document.title = `Modifier — ${em.title} — Solitiquo`;
      } catch (err) {
        const msg = document.getElementById('status-msg');
        msg.style.color = 'red';
        msg.textContent = 'Erreur de chargement : ' + err.message;
      }
    }

    (async function checkAccess() {
      await initLanguageSwitcher();
      const user = await SolitiquoAPI.getProfile();
      if (!user || (user.role !== 'admin' && user.role !== 'writer')) {
        window.location.href = 'auth.html';
        return;
      }
      await maybeLoadEmission();
    })();

    document.getElementById('emissionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.querySelector('.btn-publish');
      const msg = document.getElementById('status-msg');
      btn.textContent = 'Traitement...'; btn.disabled = true; msg.textContent = '';

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('category', document.getElementById('category').value);
      formData.append('video_url', document.getElementById('video_url').value);
      formData.append('duration_seconds', (parseInt(document.getElementById('duration').value) || 0) * 60);

      const imgFile = document.getElementById('image_file').files[0];
      if (imgFile) formData.append('thumbnail', imgFile);

      try {
        const method = editId ? 'PUT' : 'POST';
        const endpoint = editId ? `${window.API_URL}/emissions/${editId}` : `${window.API_URL}/emissions`;
        const res = await fetch(endpoint, { method, body: formData });
        const json = await res.json();
        if (json.success) {
          msg.style.color = 'green';
          msg.textContent = editId ? '✅ Émission mise à jour !' : '✅ Émission publiée !';
          setTimeout(() => window.location.href = 'emissions.html', 1000);
        } else { throw new Error(json.error); }
      } catch (err) {
        msg.style.color = 'red'; msg.textContent = 'Erreur: ' + err.message;
        btn.textContent = editId ? 'Réessayer' : 'Mettre en ligne'; btn.disabled = false;
      }
    });
  </script>
  <script src="/js/lazyload.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');

</body>
