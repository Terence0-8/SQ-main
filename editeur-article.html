<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#37463D">
  <meta name="description" content="Éditeur d'article — Publiez du contenu sur Solitiquo.">
  <meta property="og:title" content="Solitiquo — L'Actualité Premium" />
  <meta property="og:description" content="Le média de référence pour l'analyse politique et sociale au Cameroun." />
  <meta property="og:image" content="https://solitiquo.com/logo.png" />
  <meta property="og:url" content="https://solitiquo.com" />
  <meta property="og:type" content="website" />
  <link rel="alternate" hreflang="fr" href="https://solitiquo.com/fr/" />
  <link rel="alternate" hreflang="en" href="https://solitiquo.com/en/" />
  <link rel="alternate" hreflang="x-default" href="https://solitiquo.com/" />
  <!-- Preconnect to external servers -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://img.youtube.com" />
  <title>Studio — Solitiquo</title>
  <link rel="stylesheet" href="css/shared.css?v=13" />
  <link rel="stylesheet" href="css/pages/editeur-article.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@400;700&display=swap&subset=latin-ext"
    rel="stylesheet">
  <!-- Favicon & icônes app -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png">
  <link rel="icon" href="/favicon.ico">
  <!-- Apple / iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png">
  <meta name="apple-mobile-web-app-title" content="Solitiquo">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body id="page-editeur-article">

  <header class="premium-header">
    <div class="ph-left">
      <div class="burger-container">
        <button class="burger-btn" id="burgerBtn">
          <div class="burger-line"></div>
          <div class="burger-line"></div>
          <div class="burger-line"></div>
        </button>
      </div>
      <a href="index.html" class="ph-brand">
        <img src="logo.svg" alt="S">
        <div class="brand-sep"></div>
        <span class="brand-text">Solitiquo</span>
      </a>
    </div>

    <div class="ph-center">
      <nav class="ph-nav">
        <a href="politique.html" class="ph-link" data-i18n="nav_pol">Politique</a>
        <a href="social.html" class="ph-link" data-i18n="nav_soc">Social</a>
        <a href="partis-politiques.html" class="ph-link" data-i18n="nav_parties">Partis</a>
        <a href="emissions.html" class="ph-link" data-i18n="nav_shows">Émissions</a>
        <a href="podcasts.html" class="ph-link" data-i18n="nav_podcasts">Podcasts</a>
      </nav>
    </div>

    <div class="ph-right" style="justify-content: flex-end; gap: 20px;">
      <div class="lang-switch-container">
        <button class="lang-seg-btn active" data-lang="fr">FR</button>
        <button class="lang-seg-btn" data-lang="en">EN</button>
      </div>
      <div class="search-stack">
        <div class="search-row">
          <button class="search-btn" id="searchBtn" type="button" aria-label="Ouvrir la recherche">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="M21 21l-4.35-4.35" />
            </svg>
          </button>
          <span class="search-label" id="searchLabel">Rechercher</span>
        </div>
        <form class="search-container" id="searchContainer" action="recherche.html" method="GET">
          <input type="text" name="q" class="search-input" placeholder="Rechercher..." id="searchInput"
            autocomplete="off" required />
          <button class="search-submit" type="submit" aria-label="Lancer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </form>
      </div>
      <a href="auth.html" class="ph-btn-auth" data-i18n="nav_login">S'identifier</a>
    </div>

    <button id="burgerSearchBtn" class="burger-search-btn" aria-label="Rechercher">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
    </button>
  </header>

  <form id="articleForm" class="workspace">

    <aside class="toolbar-left">
      <button type="button" class="tool-btn" onclick="format('bold')"><b>B</b></button>
      <button type="button" class="tool-btn" onclick="format('italic')"><i>I</i></button>
      <div class="tool-separator"></div>
      <button type="button" class="tool-btn" onclick="format('formatBlock', 'h2')">H2</button>
      <button type="button" class="tool-btn" style="font-family:'Playfair Display'; color:#C82823;"
        onclick="format('formatBlock', 'blockquote')">“”</button>
      <div class="tool-separator"></div>
      <button type="button" class="tool-btn" onclick="format('insertUnorderedList')">•—</button>
      <button type="button" class="tool-btn" onclick="format('removeFormat')">✕</button>
    </aside>

    <div class="paper-zone">
      <div class="paper-sheet">
        <input type="text" id="title" placeholder="Titre de l'article..." autocomplete="off" required>
        <div id="editor-content" contenteditable="true">
          <p>Écrivez votre article ici...</p>
        </div>
      </div>
    </div>

    <aside class="settings-right">
      <div class="settings-scroll">

        <h3 class="panel-title">Publication</h3>

        <div class="field-group">
          <label>Catégorie / Thème</label>
          <select id="category" class="sidebar-input" onchange="toggleCustomCategory(this.value)">
            <option value="Politique">Politique</option>
            <option value="Social">Social</option>
            <option value="Économie">Économie</option>
            <option value="Culture">Culture</option>
            <option value="International">International</option>
            <option value="Société">Société</option>
            <option value="Éducation">Éducation</option>
            <option value="Santé">Santé</option>
            <option value="Sport">Sport</option>
            <option value="Environnement">Environnement</option>
            <option value="Technologie">Technologie</option>
            <option value="Opinions">Opinions</option>
            <option value="Partis">Partis</option>
            <option value="Général">Général</option>
            <option value="custom">✏️ Thème personnalisé...</option>
          </select>
          <input type="text" id="custom_category" class="sidebar-input" placeholder="Saisissez votre thème personnalisé..." style="display:none; margin-top:8px;" />
        </div>

        <div class="field-group">
          <label>Tags / Mots-clés</label>
          <div class="tags-container" id="tags-container">
            <input type="text" id="tag-input" placeholder="Ajouter + Entrée">
          </div>
          <small style="color:#999; font-size:0.75rem;">Appuyez sur Entrée pour valider un tag.</small>
        </div>

        <div class="field-group">
          <label>Résumé</label>
          <textarea id="excerpt" rows="4" class="sidebar-input" placeholder="Accroche..."></textarea>
        </div>

        <h3 class="panel-title">Illustration</h3>
        <div class="field-group">
          <div class="img-preview-box" onclick="document.getElementById('image_file').click()">
            <img id="current-image-preview" src="" style="display:none;" loading="lazy">
            <span id="upload-text" class="upload-label">📷 Ajouter image</span>
          </div>
          <input type="file" id="image_file" accept="image/*" style="display:none;" onchange="previewImage(this)">
        </div>
        <div class="field-group">
          <input type="url" id="image_url" class="sidebar-input" placeholder="Ou via URL https://..."
            oninput="updatePreviewFromUrl(this.value)">
        </div>
        <div class="field-group">
          <input type="text" id="image_caption" class="sidebar-input" placeholder="Légende / Crédit">
        </div>

        <h3 class="panel-title">SEO</h3>
        <div class="field-group">
          <input type="text" id="slug" class="sidebar-input" placeholder="slug-auto"
            style="background:#f4f4f4; color:#666;">
        </div>
      </div>

      <div class="settings-footer">
        <button type="submit" class="btn-publish">Publier</button>
        <div id="status-msg"></div>
      </div>
    </aside>
  </form>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="/js/api.js?v=13"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => await initLanguageSwitcher({ reloadPage: true }));
    function format(cmd, val = null) { document.execCommand(cmd, false, val); }

    // --- GESTION DES TAGS ---
    let currentTags = [];
    const tagInput = document.getElementById('tag-input');
    const tagsContainer = document.getElementById('tags-container');

    function renderTags() {
      const chips = tagsContainer.querySelectorAll('.tag-chip');
      chips.forEach(c => c.remove());
      currentTags.forEach((tag, index) => {
        const chip = document.createElement('div');
        chip.className = 'tag-chip';
        chip.innerHTML = `${tag} <span class="tag-remove" onclick="removeTag(${index})">×</span>`;
        tagsContainer.insertBefore(chip, tagInput);
      });
    }

    function removeTag(index) {
      currentTags.splice(index, 1);
      renderTags();
    }

    tagInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = tagInput.value.trim();
        if (val && !currentTags.includes(val)) {
          currentTags.push(val);
          tagInput.value = '';
          renderTags();
        }
      }
    });

    // --- GESTION IMAGE ---
    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = document.getElementById('current-image-preview');
          img.src = e.target.result; img.style.display = 'block';
          document.getElementById('upload-text').style.display = 'none';
          document.getElementById('image_url').value = '';
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function updatePreviewFromUrl(url) {
      if (url) {
        const img = document.getElementById('current-image-preview');
        img.src = url; img.style.display = 'block';
        document.getElementById('upload-text').style.display = 'none';
        document.getElementById('image_file').value = '';
      }
    }

    function toggleCustomCategory(val) {
      const customInput = document.getElementById('custom_category');
      if (val === 'custom') {
        customInput.style.display = 'block';
        customInput.focus();
      } else {
        customInput.style.display = 'none';
      }
    }

    // Slug auto
    document.getElementById('title').addEventListener('input', e => {
      if (!window.isEditing) {
        document.getElementById('slug').value = e.target.value
          .toLowerCase().trim()
          .replace(/[^\w\s-]/g, '')
          .replace(/[\s_-]+/g, '-');
      }
    });

    // --- INIT ---
    window.isEditing = false;
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');
    const submitBtn = document.querySelector('.btn-publish');

    if (editId) {
      window.isEditing = true;
      submitBtn.textContent = 'Mettre à jour';
      loadArticleData(editId);
    }

    async function loadArticleData(id) {
      try {
        const res = await fetch(`${window.API_URL}/articles/${id}`);
        const json = await res.json();
        if (json.success) {
          const art = json.article;
          document.getElementById('title').value = art.title;
          document.getElementById('slug').value = art.slug;
          document.getElementById('editor-content').innerHTML = art.content;
          document.getElementById('excerpt').value = art.excerpt || '';
          
          const catSelect = document.getElementById('category');
          const customInput = document.getElementById('custom_category');
          const hasOption = Array.from(catSelect.options).some(o => o.value.toLowerCase() === (art.category || '').toLowerCase());
          if (hasOption) {
            catSelect.value = art.category;
            customInput.style.display = 'none';
          } else if (art.category) {
            catSelect.value = 'custom';
            customInput.value = art.category;
            customInput.style.display = 'block';
          }

          document.getElementById('image_url').value = art.image_url || '';
          document.getElementById('image_caption').value = art.image_caption || '';
          if (art.image_url) updatePreviewFromUrl(art.image_url);
          if (art.tags && Array.isArray(art.tags)) {
            currentTags = art.tags;
            renderTags();
          }
        }
      } catch (e) { console.error(e); }
    }

    // --- ENVOI ---
    document.getElementById('articleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('status-msg');
      submitBtn.textContent = 'Traitement...';
      submitBtn.disabled = true;
      statusDiv.textContent = '';

      const catSelectVal = document.getElementById('category').value;
      const customCatVal = document.getElementById('custom_category').value.trim();
      const finalCategory = (catSelectVal === 'custom' && customCatVal) ? customCatVal : catSelectVal;

      const formData = new FormData();
      formData.append('title',         document.getElementById('title').value);
      formData.append('slug',          document.getElementById('slug').value);
      formData.append('content',       document.getElementById('editor-content').innerHTML);
      formData.append('excerpt',       document.getElementById('excerpt').value);
      formData.append('category',      finalCategory);
      formData.append('image_url',     document.getElementById('image_url').value);
      formData.append('image_caption', document.getElementById('image_caption').value);
      formData.append('tags',          JSON.stringify(currentTags));
      formData.append('lang',          'fr');
      formData.append('author_id',     1);

      const fileInput = document.getElementById('image_file');
      if (fileInput.files[0]) formData.append('image_file', fileInput.files[0]);

      try {
        const url = window.isEditing
          ? `${window.API_URL}/articles/${editId}`
          : `${window.API_URL}/articles`;
        const method = window.isEditing ? 'PUT' : 'POST';

        // ✅ credentials: 'include' pour envoyer le cookie de session
        // ✅ X-CSRF-Token pour passer le middleware verifyCsrf du backend
        const res = await fetch(url, {
          method,
          body: formData,
          credentials: 'include',
          headers: { 'X-CSRF-Token': SolitiquoAPI.csrfToken }
        });

        const json = await res.json();

        if (json.success) {
          statusDiv.style.color = 'green';
          statusDiv.textContent = window.isEditing ? '✅ Mis à jour !' : '✅ Publié !';
          setTimeout(() => window.location.href = `article.html?id=${json.article.id}`, 1000);
        } else {
          throw new Error(json.error);
        }
      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = '❌ ' + err.message;
        submitBtn.textContent = window.isEditing ? 'Mettre à jour' : 'Publier';
        submitBtn.disabled = false;
      }
    });
  </script>

  <script src="/js/lazyload.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <script src="/js/solitiquo.js?v=13"></script>
</body>

</html>
