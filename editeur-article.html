<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <!-- Preconnect to external servers -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://img.youtube.com" />
  <title>Studio — Solitiquo</title>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/pages/editeur-article.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@400;700&display=swap&subset=latin-ext"
    rel="stylesheet">

</head>

<body id="page-editeur-article">

  <header class="studio-header">
    <div class="logo-area"><img src="logo.svg" alt="S"><span>Studio</span></div>
    <div style="flex:1;"></div>
    <div class="lang-switch-container" style="margin-right:20px;">
      <button class="lang-seg-btn active" data-lang="fr">FR</button>
      <button class="lang-seg-btn" data-lang="en">EN</button>
    </div>
    <a href="index.html" class="back-btn">← Retour au site</a>
  </header>

  <form id="articleForm" class="workspace">

    <aside class="toolbar-left">
      <button type="button" class="tool-btn" onclick="format('bold')"><b>B</b></button>
      <button type="button" class="tool-btn" onclick="format('italic')"><i>I</i></button>
      <div class="tool-separator"></div>
      <button type="button" class="tool-btn" onclick="format('formatBlock', 'h2')">H2</button>
      <button type="button" class="tool-btn" style="font-family:'Playfair Display'; color:#C82823;"
        onclick="format('formatBlock', 'blockquote')">“ ”</button>
      <div class="tool-separator"></div>
      <button type="button" class="tool-btn" onclick="format('insertUnorderedList')">•—</button>
      <button type="button" class="tool-btn" onclick="format('removeFormat')">✕</button>
    </aside>

    <div class="paper-zone">
      <div class="paper-sheet">
        <input type="text" id="title" placeholder="Titre de l'article..." autocomplete="off" required>
        <div id="editor-content" contenteditable="true">
          <p>Écrivez votre article ici...</p>
        </div>
      </div>
    </div>

    <aside class="settings-right">
      <div class="settings-scroll">

        <h3 class="panel-title">Publication</h3>

        <div class="field-group">
          <label>Catégorie</label>
          <select id="category" class="sidebar-input">
            <option>Politique</option>
            <option>Social</option>
            <option>Économie</option>
            <option>Partis</option>
          </select>
        </div>

        <div class="field-group">
          <label>Tags / Mots-clés</label>
          <div class="tags-container" id="tags-container">
            <input type="text" id="tag-input" placeholder="Ajouter + Entrée">
          </div>
          <small style="color:#999; font-size:0.75rem;">Appuyez sur Entrée pour valider un tag.</small>
        </div>

        <div class="field-group">
          <label>Résumé</label>
          <textarea id="excerpt" rows="4" class="sidebar-input" placeholder="Accroche..."></textarea>
        </div>

        <h3 class="panel-title">Illustration</h3>
        <div class="field-group">
          <div class="img-preview-box" onclick="document.getElementById('image_file').click()">
            <img id="current-image-preview" src="" style="display:none;" loading="lazy">
            <span id="upload-text" class="upload-label">📷 Ajouter image</span>
          </div>
          <input type="file" id="image_file" accept="image/*" style="display:none;" onchange="previewImage(this)">
        </div>
        <div class="field-group">
          <input type="url" id="image_url" class="sidebar-input" placeholder="Ou via URL https://..."
            oninput="updatePreviewFromUrl(this.value)">
        </div>
        <div class="field-group">
          <input type="text" id="image_caption" class="sidebar-input" placeholder="Légende / Crédit">
        </div>

        <h3 class="panel-title">SEO</h3>
        <div class="field-group">
          <input type="text" id="slug" class="sidebar-input" placeholder="slug-auto"
            style="background:#f4f4f4; color:#666;">
        </div>
      </div>

      <div class="settings-footer">
        <button type="submit" class="btn-publish">Publier</button>
        <div id="status-msg"></div>
      </div>
    </aside>
  </form>

  <!-- AJOUTER CES 2 LIGNES AVANT   <script src="/js/lazyload.js"></script>
</body> -->
  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => await initLanguageSwitcher({ reloadPage: true }));
    function format(cmd, val = null) { document.execCommand(cmd, false, val); }

    // --- GESTION DES TAGS ---
    let currentTags = [];
    const tagInput = document.getElementById('tag-input');
    const tagsContainer = document.getElementById('tags-container');

    function renderTags() {
      // On garde l'input, on supprime les anciennes chips
      const chips = tagsContainer.querySelectorAll('.tag-chip');
      chips.forEach(c => c.remove());

      currentTags.forEach((tag, index) => {
        const chip = document.createElement('div');
        chip.className = 'tag-chip';
        chip.innerHTML = `${tag} <span class="tag-remove" onclick="removeTag(${index})">×</span>`;
        tagsContainer.insertBefore(chip, tagInput);
      });
    }

    function removeTag(index) {
      currentTags.splice(index, 1);
      renderTags();
    }

    tagInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = tagInput.value.trim();
        if (val && !currentTags.includes(val)) {
          currentTags.push(val);
          tagInput.value = '';
          renderTags();
        }
      }
    });

    // --- GESTION IMAGE ---
    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = document.getElementById('current-image-preview');
          img.src = e.target.result; img.style.display = 'block';
          document.getElementById('upload-text').style.display = 'none';
          document.getElementById('image_url').value = '';
        }
        reader.readAsDataURL(input.files[0]);
      }
    }
    function updatePreviewFromUrl(url) {
      if (url) {
        const img = document.getElementById('current-image-preview');
        img.src = url; img.style.display = 'block';
        document.getElementById('upload-text').style.display = 'none';
        document.getElementById('image_file').value = '';
      }
    }

    // Slug auto
    document.getElementById('title').addEventListener('input', e => {
      if (!window.isEditing) {
        document.getElementById('slug').value = e.target.value.toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-');
      }
    });

    // --- INIT ---
    window.isEditing = false;
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');
    const submitBtn = document.querySelector('.btn-publish');

    if (editId) {
      window.isEditing = true;
      submitBtn.textContent = "Mettre à jour";
      loadArticleData(editId);
    }

    async function loadArticleData(id) {
      try {
        const res = await fetch(`${window.API_URL}/articles/${id}`);
        const json = await res.json();
        if (json.success) {
          const art = json.article;
          document.getElementById('title').value = art.title;
          document.getElementById('slug').value = art.slug;
          document.getElementById('editor-content').innerHTML = art.content;
          document.getElementById('excerpt').value = art.excerpt || '';
          document.getElementById('category').value = art.category;
          document.getElementById('image_url').value = art.image_url || '';
          document.getElementById('image_caption').value = art.image_caption || '';
          if (art.image_url) updatePreviewFromUrl(art.image_url);

          // Charger les tags
          if (art.tags && Array.isArray(art.tags)) {
            currentTags = art.tags;
            renderTags();
          }
        }
      } catch (e) { console.error(e); }
    }

    // --- ENVOI ---
    document.getElementById('articleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('status-msg');
      submitBtn.textContent = 'Traitement...';
      submitBtn.disabled = true;
      statusDiv.textContent = '';

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('slug', document.getElementById('slug').value);
      formData.append('content', document.getElementById('editor-content').innerHTML);
      formData.append('excerpt', document.getElementById('excerpt').value);
      formData.append('category', document.getElementById('category').value);
      formData.append('image_url', document.getElementById('image_url').value);
      formData.append('image_caption', document.getElementById('image_caption').value);

      // Envoi des tags comme chaîne JSON
      formData.append('tags', JSON.stringify(currentTags));

      formData.append('lang', 'fr');
      formData.append('author_id', 1);

      const fileInput = document.getElementById('image_file');
      if (fileInput.files[0]) formData.append('image_file', fileInput.files[0]);

      try {
        const url = window.isEditing
          ? `${window.API_URL}/articles/${editId}`
          : `${window.API_URL}/articles`;
        const method = window.isEditing ? 'PUT' : 'POST';

        const res = await fetch(url, { method: method, body: formData });
        const json = await res.json();

        if (json.success) {
          statusDiv.style.color = 'green';
          statusDiv.textContent = window.isEditing ? '✅ Mis à jour !' : '✅ Publié !';
          setTimeout(() => window.location.href = `article.html?id=${json.article.id}`, 1000);
        } else {
          throw new Error(json.error);
        }
      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = '❌ ' + err.message;
        submitBtn.textContent = window.isEditing ? 'Mettre à jour' : 'Publier';
        submitBtn.disabled = false;
      }
    });
  </script>
  <script src="/js/lazyload.js"></script>
</body>

</html>
