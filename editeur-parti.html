<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Studio Partis — Solitiquo</title>
    <link rel="stylesheet" href="solitiquo.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap"
        rel="stylesheet">
    <style>
        /* On reprend les variables du Studio */
        :root {
            --primary-dark: #37463D;
            --accent-red: #C82823;
            --bg-app: #F0F2F5;
            --bg-paper: #ffffff;
            --sidebar-width: 340px;
            --toolbar-width: 70px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg-app);
            color: #2c2c2c;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .studio-header {
            height: 60px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .logo-area img {
            height: 24px;
        }

        .back-btn {
            text-decoration: none;
            color: #666;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--accent-red);
        }

        /* WORKSPACE */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* TOOLBAR */
        .toolbar-left {
            width: var(--toolbar-width);
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            gap: 15px;
            z-index: 40;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            color: #555;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-btn:hover {
            background: #f0f0f0;
            color: var(--primary-dark);
        }

        .tool-separator {
            width: 20px;
            height: 1px;
            background: #ddd;
            margin: 5px 0;
        }

        /* PAPER ZONE */
        .paper-zone {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .paper-sheet {
            width: 100%;
            max-width: 850px;
            background: var(--bg-paper);
            min-height: 80vh;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
            padding: 60px 70px;
            border-radius: 2px;
        }

        #party-name {
            width: 100%;
            border: none;
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary-dark);
            margin-bottom: 10px;
            outline: none;
            line-height: 1.1;
        }

        #party-acronym {
            font-family: 'Inter';
            font-size: 1.5rem;
            font-weight: 800;
            color: #999;
            border: none;
            outline: none;
            margin-bottom: 30px;
            display: block;
            width: 100%;
            text-transform: uppercase;
        }

        #editor-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #333;
            outline: none;
            min-height: 400px;
        }

        #editor-content h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-dark);
            font-size: 1.8rem;
            margin-top: 2rem;
        }

        /* SIDEBAR SETTINGS */
        .settings-right {
            width: var(--sidebar-width);
            background: white;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 40;
        }

        .settings-scroll {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .settings-footer {
            padding: 20px;
            border-top: 1px solid #eee;
            background: #fbfcfb;
        }

        h3.panel-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #999;
            margin: 25px 0 15px 0;
            font-weight: 700;
        }

        h3.panel-title:first-child {
            margin-top: 0;
        }

        .field-group {
            margin-bottom: 15px;
        }

        .field-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #444;
        }

        .sidebar-input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Inter';
            font-size: 0.9rem;
        }

        /* UPLOAD MINI */
        .mini-upload {
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 6px;
        }

        .preview-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #eee;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        .upload-btn-text {
            font-size: 0.8rem;
            color: var(--primary-dark);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        .btn-save {
            background: var(--primary-dark);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-save:hover {
            background: #2a3630;
        }
    </style>
</head>

<body>

    <header class="studio-header">
        <div class="logo-area"><img src="logo.svg" alt="S"><span>Studio Partis</span></div>
        <a href="admin.html" class="back-btn">← Retour Dashboard</a>
    </header>

    <form id="partyForm" class="workspace">

        <aside class="toolbar-left">
            <button type="button" class="tool-btn" onclick="format('bold')"><b>B</b></button>
            <button type="button" class="tool-btn" onclick="format('italic')"><i>I</i></button>
            <div class="tool-separator"></div>
            <button type="button" class="tool-btn" onclick="format('formatBlock', 'h2')">H2</button>
            <button type="button" class="tool-btn" onclick="format('insertUnorderedList')">•—</button>
        </aside>

        <div class="paper-zone">
            <div class="paper-sheet">
                <input type="text" id="party-name" placeholder="Nom complet du Parti..." autocomplete="off" required>
                <input type="text" id="party-acronym" placeholder="ACRONYME (ex: RDPC)" required>
                <div id="editor-content" contenteditable="true">
                    <p>Histoire, idéologie et fondements...</p>
                </div>
            </div>
        </div>

        <aside class="settings-right">
            <div class="settings-scroll">

                <h3 class="panel-title">Identité Visuelle</h3>
                <div class="field-group">
                    <label>Logo du Parti</label>
                    <div class="mini-upload" onclick="document.getElementById('logo_file').click()">
                        <img id="preview-logo" class="preview-circle" src="https://placehold.co/50?text=Logo">
                        <span class="upload-btn-text">Choisir image...</span>
                    </div>
                    <input type="file" id="logo_file" hidden accept="image/*" onchange="preview(this, 'preview-logo')">
                    <input type="text" id="logo_url" class="sidebar-input" placeholder="Ou URL..."
                        style="margin-top:5px; font-size:0.8rem;">
                </div>

                <div class="field-group">
                    <label>Photo du Leader</label>
                    <div class="mini-upload" onclick="document.getElementById('leader_file').click()">
                        <img id="preview-leader" class="preview-circle" src="https://placehold.co/50?text=Chef">
                        <span class="upload-btn-text">Choisir photo...</span>
                    </div>
                    <input type="file" id="leader_file" hidden accept="image/*"
                        onchange="preview(this, 'preview-leader')">
                    <input type="text" id="leader_url" class="sidebar-input" placeholder="Ou URL..."
                        style="margin-top:5px; font-size:0.8rem;">
                </div>

                <h3 class="panel-title">Fiche Technique</h3>
                <div class="field-group">
                    <label>Nom du Leader</label>
                    <input type="text" id="leader_name" class="sidebar-input" placeholder="Prénom Nom">
                </div>
                <div class="field-group">
                    <label>Positionnement</label>
                    <select id="type" class="sidebar-input">
                        <option value="majorite">Majorité Présidentielle</option>
                        <option value="opposition">Opposition</option>
                        <option value="historique">Historique / Non-actif</option>
                    </select>
                </div>
                <div class="field-group">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div>
                            <label>Fondation</label>
                            <input type="text" id="creation_date" class="sidebar-input" placeholder="1985">
                        </div>
                        <div>
                            <label>Sièges AN</label>
                            <input type="number" id="seats" class="sidebar-input" value="0">
                        </div>
                    </div>
                </div>

                <h3 class="panel-title">Contenu Exclusif</h3>
                <div class="field-group">
                    <label>Podcast du Dossier</label>
                    <input type="text" id="podcast_title" class="sidebar-input"
                        placeholder="Titre de l'épisode (ex: L'histoire du parti)" style="margin-bottom:10px;">

                    <div class="mini-upload" onclick="document.getElementById('audio_file').click()"
                        style="background:#f8f9fa; border-style:dashed;">
                        <div
                            style="width:40px; height:40px; background:#e2e8f0; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:1.2rem;">
                            🎙️</div>
                        <div>
                            <span class="upload-btn-text" id="audio-label">Uploader l'audio (MP3)...</span>
                        </div>
                    </div>

                    <input type="file" id="audio_file" hidden accept="audio/*" onchange="previewAudio(this)">
                    <input type="hidden" id="linked_podcast_id">
                </div>

                <div class="settings-footer">
                    <button type="submit" class="btn-save">Enregistrer le dossier</button>
                    <div id="msg" style="text-align:center; margin-top:10px; font-size:0.85rem;"></div>
                </div>
        </aside>
    </form>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        (async function init() {
            // 1. Vérif Auth
            const user = await SolitiquoAPI.getProfile();
            if (!user || (user.role !== 'admin' && user.role !== 'writer')) window.location.href = 'auth.html';

            // 2. Charger la liste des Podcasts
            try {
                const res = await fetch(API_URL + '/podcasts');
                const json = await res.json();
                if (json.success) {
                    const select = document.getElementById('linked_podcast');
                    json.data.forEach(pod => {
                        const opt = document.createElement('option');
                        opt.value = pod.id;
                        opt.textContent = pod.title;
                        select.appendChild(opt);
                    });
                }
            } catch (e) { }

            // 3. Si Mode Modification (ID dans l'URL)
            const params = new URLSearchParams(window.location.search);
            if (params.get('id')) loadParty(params.get('id'));
        })();

        // ATTENTION: document.execCommand est déprécié (Fix #15)
        // TODO: Migrer vers TipTap, Quill ou ProseMirror pour un éditeur moderne
        function format(cmd, val = null) { document.execCommand(cmd, false, val); }

        function preview(input, imgId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => document.getElementById(imgId).src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        function previewAudio(input) {
            if (input.files && input.files[0]) {
                document.getElementById('audio-label').textContent = "Fichier sélectionné : " + input.files[0].name;
                document.getElementById('audio-label').style.color = "green";
            }
        }

        // CHARGEMENT POUR EDIT
        async function loadParty(id) {
            const res = await fetch(`${API_URL}/parties/${id}`);
            const json = await res.json();
            if (json.success) {
                const p = json.data;
                document.getElementById('party-name').value = p.name;
                document.getElementById('party-acronym').value = p.acronym;
                document.getElementById('editor-content').innerHTML = p.description;
                document.getElementById('leader_name').value = p.leader_name;
                document.getElementById('type').value = p.type;
                document.getElementById('creation_date').value = p.creation_date;
                document.getElementById('seats').value = p.seats_assembly;
                document.getElementById('logo_url').value = p.logo_url;
                document.getElementById('leader_url').value = p.leader_photo_url;
                if (p.logo_url) document.getElementById('preview-logo').src = p.logo_url;
                if (p.leader_photo_url) document.getElementById('preview-leader').src = p.leader_photo_url;
                if (p.podcast_id) {
                    document.getElementById('linked_podcast_id').value = p.podcast_id;
                    document.getElementById('audio-label').textContent = "✅ Podcast actif (Uploader pour remplacer)";
                }
            }
        }

        // SAUVEGARDE (Version compatible Upload Fichiers & Audio)
        document.getElementById('partyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('.btn-save');
            const msg = document.getElementById('msg');
            btn.textContent = "Enregistrement..."; btn.disabled = true;

            // 1. Utilisation de FormData pour envoyer des fichiers
            const formData = new FormData();

            // Champs texte
            formData.append('name', document.getElementById('party-name').value);
            formData.append('acronym', document.getElementById('party-acronym').value);
            formData.append('description', document.getElementById('editor-content').innerHTML);
            formData.append('leader_name', document.getElementById('leader_name').value);
            formData.append('type', document.getElementById('type').value);
            formData.append('creation_date', document.getElementById('creation_date').value);
            formData.append('seats_assembly', document.getElementById('seats').value);

            // Note: On n'ajoute plus 'podcast_id' ici, on le gère plus bas avec l'audio

            // 2. Gestion intelligente des images
            // LOGO
            const logoFile = document.getElementById('logo_file').files[0];
            if (logoFile) {
                formData.append('logo_file', logoFile);
            } else {
                formData.append('logo_url', document.getElementById('logo_url').value);
            }

            // LEADER
            const leaderFile = document.getElementById('leader_file').files[0];
            if (leaderFile) {
                formData.append('leader_file', leaderFile);
            } else {
                formData.append('leader_photo_url', document.getElementById('leader_url').value);
            }

            // ... (Gestion images) ...

            // 3. GESTION PODCAST
            const audioFile = document.getElementById('audio_file').files[0];
            if (audioFile) {
                formData.append('audio_file', audioFile);
            }

            // AJOUT DU TITRE ICI
            formData.append('podcast_title', document.getElementById('podcast_title').value);

            const existingPodcastId = document.getElementById('linked_podcast_id').value;
            formData.append('podcast_id', existingPodcastId || '');

            // ... (Reste du code fetch) ...

            // 4. Envoi au serveur
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const url = id ? `${API_URL}/parties/${id}` : API_URL + '/parties';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    body: formData
                });
                const json = await res.json();

                if (json.success) {
                    msg.style.color = "green"; msg.textContent = "✅ Dossier enregistré !";
                    // Redirection vers le dossier public
                    setTimeout(() => window.location.href = `dossier.html?id=${json.id || id}`, 1500);
                } else throw new Error(json.error);
            } catch (err) {
                msg.style.color = "red"; msg.textContent = "Erreur : " + err.message;
                btn.textContent = "Enregistrer le dossier"; btn.disabled = false;
            }
        });
    </script>
</body>

</html>
