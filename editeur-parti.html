<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#37463D">
  <meta name="description" content="Éditeur de parti — Gérez les fiches des partis politiques.">
  <meta property="og:title" content="Solitiquo — L'Actualité Premium" />
  <meta property="og:description" content="Le média de référence pour l'analyse politique et sociale au Cameroun." />
  <meta property="og:image" content="https://solitiquo.com/logo.png" />
  <meta property="og:url" content="https://solitiquo.com" />
  <meta property="og:type" content="website" />
  <link rel="alternate" hreflang="fr" href="https://solitiquo.com/fr/" />
  <link rel="alternate" hreflang="en" href="https://solitiquo.com/en/" />
  <link rel="alternate" hreflang="x-default" href="https://solitiquo.com/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://img.youtube.com" />
  <title>Studio Partis — Solitiquo</title>
  <link rel="stylesheet" href="css/shared.css?v=37" />
  <link rel="stylesheet" href="css/pages/editeur-parti.css?v=37" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@400;700&display=swap&subset=latin-ext" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png">
  <meta name="apple-mobile-web-app-title" content="Solitiquo">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body id="page-editeur-parti">

  <header class="premium-header">
    <div class="ph-left">
      <div class="burger-container">
        <button class="burger-btn" id="burgerBtn">
          <div class="burger-line"></div>
          <div class="burger-line"></div>
          <div class="burger-line"></div>
        </button>
      </div>

      <a href="index.html" class="ph-brand">
        <img src="logo.svg" alt="S">
        <div class="brand-sep"></div>
        <span class="brand-text">Solitiquo</span>
      </a>
    </div>

    <div class="ph-center">
      <nav class="ph-nav">
        <a href="politique.html" class="ph-link" data-i18n="nav_pol">Politique</a>
        <a href="social.html" class="ph-link" data-i18n="nav_soc">Social</a>
        <a href="partis-politiques.html" class="ph-link" data-i18n="nav_parties">Partis</a>
        <a href="emissions.html" class="ph-link" data-i18n="nav_shows">Émissions</a>
        <a href="podcasts.html" class="ph-link" data-i18n="nav_podcasts">Podcasts</a>
      </nav>
    </div>

    <div class="ph-right" style="justify-content: flex-end; gap: 20px;">
      <div class="lang-switch-container">
        <button class="lang-seg-btn active" data-lang="fr">FR</button>
        <button class="lang-seg-btn" data-lang="en">EN</button>
      </div>
      <div class="search-stack">
        <div class="search-row">
          <button class="search-btn" id="searchBtn" type="button" aria-label="Ouvrir la recherche">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="M21 21l-4.35-4.35" />
            </svg>
          </button>
          <span class="search-label" id="searchLabel">Rechercher</span>
        </div>

        <form class="search-container" id="searchContainer" action="recherche.html" method="GET">
          <input type="text" name="q" class="search-input" placeholder="Rechercher..." id="searchInput" autocomplete="off" required />
          <button class="search-submit" type="submit" aria-label="Lancer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </form>
      </div>
      <a href="auth.html" class="ph-btn-auth" data-i18n="nav_login">S'identifier</a>
    </div>

    <button id="burgerSearchBtn" class="burger-search-btn" aria-label="Rechercher">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
    </button>
  </header>

  <form id="partyForm" class="workspace">
    <aside class="toolbar-left">
      <button type="button" class="tool-btn" onclick="format('bold')"><b>B</b></button>
      <button type="button" class="tool-btn" onclick="format('italic')"><i>I</i></button>
      <div class="tool-separator"></div>
      <button type="button" class="tool-btn" onclick="format('formatBlock', 'h2')">H2</button>
      <button type="button" class="tool-btn" onclick="format('insertUnorderedList')">•—</button>
    </aside>

    <div class="paper-zone">
      <div class="paper-sheet">
        <input type="text" id="party-name" placeholder="Nom complet du Parti..." autocomplete="off" required>
        <input type="text" id="party-acronym" placeholder="ACRONYME (ex: RDPC)" required>
        <div id="editor-content" contenteditable="true">
          <p>Histoire, idéologie et fondements...</p>
        </div>
      </div>
    </div>

    <aside class="settings-right">
      <div class="settings-scroll">

        <h3 class="panel-title">Identité Visuelle</h3>
        <div class="field-group">
          <label>Logo du Parti</label>
          <div class="mini-upload" onclick="document.getElementById('logo_file').click()">
            <img id="preview-logo" class="preview-circle" src="https://placehold.co/50?text=Logo" loading="lazy">
            <span class="upload-btn-text">Choisir image...</span>
          </div>
          <input type="file" id="logo_file" hidden accept="image/*" onchange="preview(this, 'preview-logo')">
          <input type="text" id="logo_url" class="sidebar-input" placeholder="Ou URL..." style="margin-top:5px; font-size:0.8rem;">
        </div>

        <div class="field-group">
          <label>Photo du Leader</label>
          <div class="mini-upload" onclick="document.getElementById('leader_file').click()">
            <img id="preview-leader" class="preview-circle" src="https://placehold.co/50?text=Chef" loading="lazy">
            <span class="upload-btn-text">Choisir photo...</span>
          </div>
          <input type="file" id="leader_file" hidden accept="image/*" onchange="preview(this, 'preview-leader')">
          <input type="text" id="leader_url" class="sidebar-input" placeholder="Ou URL..." style="margin-top:5px; font-size:0.8rem;">
        </div>

        <h3 class="panel-title">Fiche Technique</h3>
        <div class="field-group">
          <label>Nom du Leader</label>
          <input type="text" id="leader_name" class="sidebar-input" placeholder="Prénom Nom">
        </div>
        <div class="field-group">
          <label>Positionnement</label>
          <select id="type" class="sidebar-input">
            <option value="majorite">Majorité Présidentielle</option>
            <option value="opposition">Opposition</option>
            <option value="historique">Historique / Non-actif</option>
          </select>
        </div>
        <div class="field-group">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div>
              <label>Fondation</label>
              <input type="text" id="creation_date" class="sidebar-input" placeholder="1985">
            </div>
            <div>
              <label>Sièges AN</label>
              <input type="number" id="seats" class="sidebar-input" value="0">
            </div>
          </div>
        </div>

        <h3 class="panel-title">Contenu Exclusif</h3>
        <div class="field-group">
          <label>Podcast du Dossier</label>
          <input type="text" id="podcast_title" class="sidebar-input" placeholder="Titre de l'épisode (ex: L'histoire du parti)" style="margin-bottom:10px;">

          <div class="mini-upload" onclick="document.getElementById('audio_file').click()" style="background:#f8f9fa; border-style:dashed;">
            <div style="width:40px; height:40px; background:#e2e8f0; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:1.2rem;">🎙️</div>
            <div>
              <span class="upload-btn-text" id="audio-label">Uploader l'audio (MP3)...</span>
            </div>
          </div>

          <input type="file" id="audio_file" hidden accept="audio/*" onchange="previewAudio(this)">
          <input type="hidden" id="linked_podcast_id">
        </div>

        <div class="settings-footer">
          <button type="submit" class="btn-save">Enregistrer le dossier</button>
          <div id="msg" style="text-align:center; margin-top:10px; font-size:0.85rem;"></div>
        </div>
      </div>
    </aside>
  </form>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="/js/api.js?v=37"></script>
  <script>
    // Helpers sûrs pour l'élément DOM
    function setVal(id, val) {
      const el = document.getElementById(id);
      if (el) el.value = (val !== null && val !== undefined) ? val : '';
    }
    function setHtml(id, val) {
      const el = document.getElementById(id);
      if (el && val) el.innerHTML = val;
    }
    function setSrc(id, val) {
      const el = document.getElementById(id);
      if (el && val) el.src = val;
    }

    function format(cmd, val = null) { document.execCommand(cmd, false, val); }

    function preview(input, imgId) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => setSrc(imgId, e.target.result);
        reader.readAsDataURL(input.files[0]);
      }
    }

    function previewAudio(input) {
      if (input.files && input.files[0]) {
        const label = document.getElementById('audio-label');
        if (label) {
          label.textContent = "Fichier sélectionné : " + input.files[0].name;
          label.style.color = "green";
        }
      }
    }

    // Chargement instantané des données du parti
    async function loadPartyData(id) {
      try {
        const baseUrl = window.API_URL || (typeof SolitiquoAPI !== 'undefined' ? SolitiquoAPI.baseUrl : '/api');
        console.log(`📂 Chargement instantané du parti ID ${id} depuis ${baseUrl}/parties/${id}`);
        const res = await fetch(`${baseUrl}/parties/${id}`);
        const json = await res.json();
        console.log(`📦 Données parti reçues:`, json);

        if (json.success && json.data) {
          const p = json.data;
          setVal('party-name', p.name);
          setVal('party-acronym', p.acronym);
          setHtml('editor-content', p.description);
          setVal('leader_name', p.leader_name);
          if (p.type) setVal('type', p.type);
          setVal('creation_date', p.creation_date || p.founded_year);
          setVal('seats', p.seats_assembly !== undefined ? p.seats_assembly : 0);
          setVal('logo_url', p.logo_url);
          setVal('leader_url', p.leader_photo_url);
          if (p.logo_url) setSrc('preview-logo', p.logo_url);
          if (p.leader_photo_url) setSrc('preview-leader', p.leader_photo_url);

          if (p.podcast_id) {
            setVal('linked_podcast_id', p.podcast_id);
            const label = document.getElementById('audio-label');
            if (label) label.textContent = "✅ Podcast actif (Uploader pour remplacer)";
            // Récupérer le titre du podcast si possible
            try {
              const podRes = await fetch(`${baseUrl}/podcasts/${p.podcast_id}`);
              const podJson = await podRes.json();
              if (podJson.success && podJson.data) {
                setVal('podcast_title', podJson.data.title);
              }
            } catch (e) {}
          }
        }
      } catch (e) {
        console.error("❌ Erreur lors du chargement des données parti:", e);
      }
    }

    // 1. DÉMARRAGE IMMÉDIAT DU CHARGEMENT DES DONNÉES EN MODE ÉDITION
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');
    const btnSave = document.querySelector('.btn-save');

    if (editId) {
      if (btnSave) btnSave.textContent = "Mettre à jour le dossier";
      loadPartyData(editId);
    }

    // 2. INITIALISATION ASYNCHRONE DE L'AUTH ET CSRF (EN PARALLÈLE)
    (async function initAuth() {
      try {
        if (typeof initLanguageSwitcher === 'function') {
          await initLanguageSwitcher({ reloadPage: false });
        }
        const user = await SolitiquoAPI.getProfile();
        if (!user || (user.role !== 'admin' && user.role !== 'writer')) {
          window.location.href = 'auth.html';
          return;
        }
        if (!SolitiquoAPI.csrfToken) {
          await SolitiquoAPI.fetchCsrfToken();
        }
      } catch (e) {
        console.warn("Avertissement auth/i18n:", e);
      }
    })();

    // Live preview URL inputs
    document.addEventListener('DOMContentLoaded', () => {
      const logoUrlInput = document.getElementById('logo_url');
      if (logoUrlInput) {
        logoUrlInput.addEventListener('input', (e) => {
          if (e.target.value) setSrc('preview-logo', e.target.value);
        });
      }
      const leaderUrlInput = document.getElementById('leader_url');
      if (leaderUrlInput) {
        leaderUrlInput.addEventListener('input', (e) => {
          if (e.target.value) setSrc('preview-leader', e.target.value);
        });
      }
    });

    // 3. SOUMISSION DU FORMULAIRE
    document.getElementById('partyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.querySelector('.btn-save');
      const msg = document.getElementById('msg');
      btn.textContent = "Enregistrement en cours..."; 
      btn.disabled = true;

      const formData = new FormData();
      formData.append('name', document.getElementById('party-name').value);
      formData.append('acronym', document.getElementById('party-acronym').value);
      formData.append('description', document.getElementById('editor-content').innerHTML);
      formData.append('leader_name', document.getElementById('leader_name').value);
      formData.append('type', document.getElementById('type').value);
      formData.append('creation_date', document.getElementById('creation_date').value);
      formData.append('seats_assembly', document.getElementById('seats').value);

      // Logo File / URL
      const logoFile = document.getElementById('logo_file').files[0];
      if (logoFile) {
        formData.append('logo_file', logoFile);
      } else {
        formData.append('logo_url', document.getElementById('logo_url').value);
      }

      // Leader Photo File / URL
      const leaderFile = document.getElementById('leader_file').files[0];
      if (leaderFile) {
        formData.append('leader_file', leaderFile);
      } else {
        formData.append('leader_photo_url', document.getElementById('leader_url').value);
      }

      // Podcast Audio
      const audioFile = document.getElementById('audio_file').files[0];
      if (audioFile) {
        formData.append('audio_file', audioFile);
      }
      formData.append('podcast_title', document.getElementById('podcast_title').value);
      const existingPodcastId = document.getElementById('linked_podcast_id').value;
      formData.append('podcast_id', existingPodcastId || '');

      const baseUrl = window.API_URL || (typeof SolitiquoAPI !== 'undefined' ? SolitiquoAPI.baseUrl : '/api');
      const url = editId ? `${baseUrl}/parties/${editId}` : `${baseUrl}/parties`;
      const method = editId ? 'PUT' : 'POST';

      if (!SolitiquoAPI.csrfToken) {
        await SolitiquoAPI.fetchCsrfToken();
      }

      try {
        const res = await fetch(url, {
          method: method,
          headers: {
            'X-CSRF-Token': SolitiquoAPI.csrfToken || ''
          },
          credentials: 'include',
          body: formData
        });
        const json = await res.json();

        if (json.success) {
          msg.style.color = "green"; 
          msg.textContent = "✅ Dossier enregistré avec succès !";
          setTimeout(() => window.location.href = `dossier.html?id=${json.id || editId}`, 1200);
        } else {
          throw new Error(json.error || 'Erreur lors de la sauvegarde');
        }
      } catch (err) {
        msg.style.color = "red"; 
        msg.textContent = "Erreur : " + err.message;
        btn.textContent = editId ? "Mettre à jour le dossier" : "Enregistrer le dossier"; 
        btn.disabled = false;
      }
    });
  </script>
  <script src="/js/lazyload.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <script src="/js/solitiquo.js?v=37"></script>
</body>

</html>
