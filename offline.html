<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#37463D" />
  <title>Hors ligne | Solitiquo</title>
  <style>
    :root {
      --primary-dark: #37463D;
      --accent-red: #C82823;
      --text-dark: #2c2c2c;
      --text-light: #6b6b6b;
      --background-light: #fbfcfb;
      --light-cream: #F8FBF1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--background-light);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* ── Header ── */
    .main-header {
      background: #fff;
      padding: 1.25rem 2rem;
      border-bottom: 4px solid var(--primary-dark);
      box-shadow: 0 4px 20px rgba(55, 70, 61, .08);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-block {
      display: flex;
      align-items: center;
      gap: .9rem;
      text-decoration: none;
    }
    .logo-img {
      height: 40px;
      width: auto;
    }
    .logo-sep {
      width: 1px;
      height: 32px;
      background: #d0d5ce;
    }
    .logo-text { display: flex; flex-direction: column; }
    .logo-name {
      font-family: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-dark);
      line-height: 1;
      letter-spacing: -.01em;
    }
    .logo-sub {
      font-size: .72rem;
      font-weight: 600;
      color: var(--accent-red);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Main ── */
    main {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      background: linear-gradient(160deg, var(--light-cream) 0%, #fff 60%);
    }
    .offline-container {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    /* Icon */
    .offline-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 2rem;
      background: linear-gradient(135deg, var(--light-cream), #eef2e8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(55, 70, 61, .12);
    }
    .offline-icon svg {
      width: 46px;
      height: 46px;
      color: var(--primary-dark);
    }

    /* Title */
    .offline-title {
      font-family: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 1rem;
      letter-spacing: -.02em;
    }

    /* Subtitle */
    .offline-sub {
      font-size: 1.05rem;
      color: var(--text-light);
      margin-bottom: .6rem;
      line-height: 1.7;
    }
    .offline-hint {
      font-size: .9rem;
      color: #9ba8a0;
      margin-bottom: 2.5rem;
    }

    /* Divider */
    .offline-divider {
      width: 48px;
      height: 3px;
      background: var(--accent-red);
      border-radius: 2px;
      margin: 1.8rem auto;
      opacity: .7;
    }

    /* Retry button */
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .9rem 2.2rem;
      background: var(--primary-dark);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background .25s ease, transform .2s ease, box-shadow .25s ease;
      box-shadow: 0 4px 14px rgba(55, 70, 61, .25);
    }
    .btn-retry:hover {
      background: #2a3530;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(55, 70, 61, .35);
    }
    .btn-retry svg { flex-shrink: 0; }

    /* Status indicator */
    .status-bar {
      margin-top: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      font-size: .82rem;
      color: #aab5ae;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d0d9d2;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .4; transform: scale(1); }
      50%       { opacity: 1; transform: scale(1.3); }
    }

    /* ── Footer ── */
    footer {
      background: var(--primary-dark);
      color: rgba(255,255,255,.55);
      text-align: center;
      padding: 1.25rem 1rem;
      font-size: .8rem;
    }
    footer a {
      color: rgba(255,255,255,.7);
      text-decoration: none;
    }
    footer a:hover { color: #fff; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .offline-title { font-size: 1.8rem; }
      .offline-icon  { width: 76px; height: 76px; }
      .offline-icon svg { width: 36px; height: 36px; }
      .main-header { padding: 1rem 1.25rem; }
    }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="header-inner">
      <a href="/" class="logo-block">
        <img src="/logo.svg" alt="Logo Solitiquo" class="logo-img" />
        <div class="logo-sep"></div>
        <div class="logo-text">
          <span class="logo-name">Solitiquo</span>
          <span class="logo-sub">Cameroun</span>
        </div>
      </a>
    </div>
  </header>

  <main>
    <div class="offline-container">

      <!-- Icône WiFi coupé -->
      <div class="offline-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </div>

      <h1 class="offline-title">Vous êtes hors ligne</h1>

      <p class="offline-sub">
        Impossible de charger cette page sans connexion internet.
      </p>
      <p class="offline-hint">
        Vérifiez votre réseau Wi-Fi ou données mobiles, puis réessayez.
      </p>

      <div class="offline-divider"></div>

      <button class="btn-retry" onclick="window.location.reload()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-3.86"/>
        </svg>
        Réessayer
      </button>

      <div class="status-bar">
        <span class="status-dot"></span>
        En attente de connexion…
      </div>

    </div>
  </main>

  <footer>
    <p>© 2025 <a href="/">Solitiquo</a> — L'actualité politique et sociale de référence</p>
  </footer>

  <script>
    // Recharger automatiquement dès que la connexion revient
    window.addEventListener('online', () => window.location.reload());
  </script>

</body>
</html>
