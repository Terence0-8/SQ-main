<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Studio Podcast — Solitiquo</title>
<link rel="stylesheet" href="solitiquo.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-dark: #37463D;
    --accent-red: #C82823;
    --bg-app: #F0F2F5;
    --bg-paper: #ffffff;
    --sidebar-width: 350px;
    --toolbar-width: 70px;
  }
  * { box-sizing: border-box; }
  
  body {
    background: var(--bg-app);
    color: #2c2c2c;
    font-family: 'Inter', sans-serif;
    height: 100vh;
    margin: 0;
    overflow: hidden; /* Empêche le scroll global, on scroll dans les zones */
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .studio-header {
    height: 60px; background: white; border-bottom: 1px solid #ddd;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 50; flex-shrink: 0;
  }
  .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--primary-dark); }
  .logo-area img { height: 24px; }
  .back-btn { text-decoration: none; color: #666; font-size: 0.9rem; transition: color 0.2s; }
  .back-btn:hover { color: var(--accent-red); }

  /* LAYOUT 3 COLONNES */
  .workspace { display: flex; flex: 1; overflow: hidden; }

  /* 1. GAUCHE : OUTILS (Fixe) */
  .toolbar-left {
    width: var(--toolbar-width);
    background: white;
    border-right: 1px solid #ddd;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 20px; gap: 15px; z-index: 40;
  }
  .tool-btn {
    width: 40px; height: 40px; border: 1px solid transparent; background: transparent;
    border-radius: 6px; cursor: pointer; color: #555; font-size: 1rem; font-weight: 600;
    transition: 0.2s; display: flex; align-items: center; justify-content: center;
  }
  .tool-btn:hover { background: #f0f0f0; color: var(--primary-dark); }
  .tool-separator { width: 20px; height: 1px; background: #ddd; margin: 5px 0; }

  /* 2. CENTRE : PAPIER (Scrollable) */
  .paper-zone {
    flex: 1;
    overflow-y: auto; /* C'est ICI que ça scrolle */
    padding: 40px;
    display: flex; justify-content: center;
    background: var(--bg-app);
  }
  .paper-sheet {
    width: 100%; max-width: 850px;
    background: var(--bg-paper);
    min-height: 100%; /* Prend toute la hauteur dispo */
    box-shadow: 0 4px 25px rgba(0,0,0,0.08);
    padding: 60px 70px;
    border-radius: 2px;
    margin-bottom: 40px; /* Marge en bas pour aérer */
  }
  
  /* Champs Édition */
  #title {
    width: 100%; border: none;
    font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 900;
    color: var(--primary-dark); margin-bottom: 30px; outline: none; line-height: 1.2;
  }
  #title::placeholder { color: #ccc; }

  .section-label {
    color: #999; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
    font-weight: 700; margin-bottom: 10px; display: block; margin-top: 40px;
    border-bottom: 1px solid #eee; padding-bottom: 5px;
  }
  
  #description {
    width: 100%; border: none; padding: 0;
    font-family: 'Inter'; font-size: 1.1rem; resize: none; /* Auto-resize via JS si besoin */
    min-height: 80px; outline: none; color: #444; line-height: 1.6;
  }
  
  /* Zone Transcription */
  #transcript-editor {
    min-height: 300px; outline: none; font-size: 1rem; line-height: 1.8; color: #333;
    white-space: pre-wrap;
  }
  #transcript-editor .time-marker {
    background: #ffecec; color: #C82823; padding: 2px 6px; border-radius: 4px;
    font-weight: 700; font-size: 0.85rem; margin-right: 5px; cursor: pointer; user-select: none;
  }

  /* 3. DROITE : PARAMÈTRES (Scrollable indépendant) */
  .settings-right {
    width: var(--sidebar-width);
    background: white;
    border-left: 1px solid #ddd;
    display: flex; flex-direction: column;
    z-index: 40;
  }
  .settings-scroll {
    padding: 25px;
    overflow-y: auto;
    flex: 1;
  }
  .settings-footer {
    padding: 20px; border-top: 1px solid #eee; background: #fbfcfb;
  }

  h3.panel-title {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.2px;
    color: #999; margin: 25px 0 15px 0; font-weight: 700;
  }
  h3.panel-title:first-child { margin-top: 0; }

  .field-group { margin-bottom: 20px; }
  .sidebar-input, select {
    width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;
    font-family: 'Inter', sans-serif; font-size: 0.9rem; transition: border 0.2s;
  }
  .sidebar-input:focus, select:focus { border-color: var(--primary-dark); outline: none; }

  /* UPLOAD BOX STYLISÉE */
  .upload-box {
    border: 2px dashed #ccc; border-radius: 8px; padding: 20px; text-align: center;
    cursor: pointer; transition: 0.2s; background: #f9f9f9; position: relative; overflow: hidden;
  }
  .upload-box:hover { border-color: var(--primary-dark); background: #fff; }
  .upload-icon { font-size: 1.5rem; display: block; margin-bottom: 5px; color: #ccc; }
  .upload-hint { font-size: 0.8rem; color: #888; display: block; }
  .file-name {
    font-size: 0.85rem; font-weight: 600; color: var(--primary-dark);
    margin-top: 8px; display: block; word-break: break-all;
  }
  
  /* Preview Image */
  #cover-preview {
    width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none;
  }

  /* Bouton Publier */
  .btn-publish {
    background: var(--accent-red); color: white; border: none;
    padding: 14px; width: 100%; font-weight: 700; font-size: 1rem;
    border-radius: 8px; cursor: pointer; transition: background 0.2s;
    box-shadow: 0 4px 12px rgba(200, 40, 35, 0.2);
  }
  .btn-publish:hover { background: #901a16; transform: translateY(-1px); }
  .btn-publish:disabled { background: #ccc; transform: none; cursor: not-allowed; }
  
  #status-msg { margin-top: 10px; font-size: 0.85rem; text-align: center; font-weight: 500; }

  @media (max-width: 1000px) {
    .workspace { flex-direction: column; overflow-y: auto; }
    .toolbar-left { width: 100%; flex-direction: row; padding: 10px; border-right: none; border-bottom: 1px solid #ddd; justify-content: center; }
    .settings-right { width: 100%; border-left: none; border-top: 1px solid #ddd; height: auto; }
    .paper-zone { padding: 20px; height: auto; overflow: visible; }
  }

  .chapter-item { display: flex; gap: 5px; margin-bottom: 8px; }
  .chap-time { width: 60px; text-align: center; }
  .chap-title { flex: 1; }
  .chap-del { background: none; border: none; color: #C82823; cursor: pointer; font-weight: bold; }

</style>
</head>
<body>

  <header class="studio-header">
    <div class="logo-area"><img src="logo.svg" alt="S"><span>Studio Podcast</span></div>
    <a href="index.html" class="back-btn">← Retour au site</a>
  </header>

  <form id="podcastForm" class="workspace">
    
    <aside class="toolbar-left">
      <button type="button" class="tool-btn" onclick="format('bold')" title="Gras"><b>B</b></button>
      <button type="button" class="tool-btn" onclick="format('italic')" title="Italique"><i>I</i></button>
      <div class="tool-separator"></div>
      <button type="button" class="tool-btn" onclick="format('removeFormat')" title="Nettoyer">✕</button>
    </aside>

    <div class="paper-zone">
      <div class="paper-sheet">
        <input type="text" id="title" placeholder="Titre de l'épisode..." required autocomplete="off">
        
        <span class="section-label">DESCRIPTION</span>
        <textarea id="description" rows="3" placeholder="Résumé de l'épisode..."></textarea>

        <span class="section-label">TRANSCRIPTION INTERACTIVE</span>
        <div id="transcript-editor" contenteditable="true">
          <p>Commencez à écrire la transcription...</p>
          <p><em>Utilisez le bouton ⏱️ à gauche pour insérer un timecode.</em></p>
        </div>
      </div>
    </div>

    <aside class="settings-right">
      <div class="settings-scroll">
        
        <h3 class="panel-title">MÉDIAS</h3>
        
        <div class="field-group">
          <label style="font-weight:600; font-size:0.85rem; margin-bottom:8px; display:block;">Fichier Audio (MP3)</label>
          <div class="upload-box" onclick="document.getElementById('audio_file').click()">
            <span class="upload-icon">🎙️</span>
            <span class="upload-hint">Choisir le fichier MP3</span>
            <span id="audio-name" class="file-name"></span>
          </div>
          <input type="file" id="audio_file" accept="audio/*" style="display:none;" required onchange="showFileName(this, 'audio-name')">
        </div>

        <div class="field-group">
          <label style="font-weight:600; font-size:0.85rem; margin-bottom:8px; display:block;">Pochette</label>
          <div class="upload-box" onclick="document.getElementById('image_file').click()" style="height:150px; display:flex; justify-content:center; align-items:center;">
            <img id="cover-preview" src="" alt="">
            <div id="cover-placeholder">
                <span class="upload-icon">🖼️</span>
                <span class="upload-hint">Uploader une image</span>
            </div>
          </div>
          <input type="file" id="image_file" accept="image/*" style="display:none;" onchange="previewCoverFile(this)">
          
          <div style="text-align:center; margin: 10px 0; font-size:0.8rem; color:#999;">— OU —</div>
          
          <input type="url" id="image_url" class="sidebar-input" placeholder="https://..." oninput="previewCoverUrl(this.value)">
        </div>

      <h3 class="panel-title">CHAPITRAGE</h3>
      <div id="chapters-container" style="margin-bottom:15px;"></div>
      <button type="button" class="btn-add-chapter" onclick="addChapterRow()" style="width:100%; padding:8px; cursor:pointer;">+ Ajouter un chapitre</button>

        <h3 class="panel-title">DÉTAILS</h3>
        
        <div class="field-group">
          <select id="category" class="sidebar-input">
            <option>Politique</option><option>Social</option><option>Économie</option><option>Culture</option><option>Géopolitique</option>
          </select>
        </div>

      </div>

      <div class="settings-footer">
        <button type="submit" class="btn-publish">Mettre en ligne</button>
        <div id="status-msg"></div>
      </div>
    </aside>
  </form>

  <script src="js/api.js"></script>
  <script>
    (async function checkAccess() {
        const user = await SolitiquoAPI.getProfile();
        if (!user || (user.role !== 'admin' && user.role !== 'writer')) {
            window.location.href = 'auth.html';
        }
    })();

    function format(cmd, val=null) { document.execCommand(cmd, false, val); }

    function addChapterRow(time = '00:00', title = '') {
    const div = document.createElement('div');
    div.className = 'chapter-item';
    div.innerHTML = `
        <input type="text" class="sidebar-input chap-time" value="${time}" placeholder="00:00">
        <input type="text" class="sidebar-input chap-title" value="${title}" placeholder="Titre">
        <button type="button" class="chap-del" onclick="this.parentElement.remove()">×</button>
    `;
    document.getElementById('chapters-container').appendChild(div);
}
// Initialisation
addChapterRow('00:00', 'Intro');

    function showFileName(input, displayId) {
        if(input.files[0]) document.getElementById(displayId).textContent = input.files[0].name;
    }

    function previewCoverFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('cover-preview');
                img.src = e.target.result; img.style.display = 'block';
                document.getElementById('cover-placeholder').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function previewCoverUrl(url) {
        if(url) {
            const img = document.getElementById('cover-preview');
            img.src = url; img.style.display = 'block';
            document.getElementById('cover-placeholder').style.display = 'none';
            document.getElementById('image_file').value = '';
        }
    }

    document.getElementById('podcastForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.querySelector('.btn-publish');
        const msg = document.getElementById('status-msg');
        
        btn.textContent = 'Envoi en cours...';
        btn.disabled = true;
        msg.textContent = '';

      const chapters = [];
document.querySelectorAll('.chapter-item').forEach(row => {
    chapters.push({
        time: row.querySelector('.chap-time').value,
        title: row.querySelector('.chap-title').value
    });
});
        const formData = new FormData();
        formData.append('title', document.getElementById('title').value);
        formData.append('description', document.getElementById('description').value);
        formData.append('transcript', document.getElementById('transcript-editor').innerHTML);
        formData.append('category', document.getElementById('category').value);
        formData.append('author_id', 1);
        
        formData.append('audio_file', document.getElementById('audio_file').files[0]);
        formData.append('chapters', JSON.stringify(chapters)); // Ajout du JSON
        const imgFile = document.getElementById('image_file').files[0];
        const imgUrl = document.getElementById('image_url').value;
        
        if(imgFile) formData.append('image_file', imgFile);
        else if(imgUrl) formData.append('image_url', imgUrl); // Attention: Backend doit gérer ce champ (optionnel)

        try {
            const res = await fetch('http://localhost:5000/api/podcasts', { method: 'POST', body: formData });
            const json = await res.json();

            if(json.success) {
                msg.style.color = 'green'; msg.textContent = '✅ Podcast publié !';
                setTimeout(() => window.location.href = 'podcasts.html', 1500);
            } else { throw new Error(json.error); }
        } catch (err) {
            msg.style.color = 'red'; msg.textContent = 'Erreur: ' + err.message;
            btn.textContent = 'Mettre en ligne'; btn.disabled = false;
        }
    });
  </script>
</body>
</html>
