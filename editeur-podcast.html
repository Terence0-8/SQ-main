  <meta property="og:title" content="Solitiquo  L'Actualité Premium" />
  <meta property="og:description" content="Le média de référence pour l'analyse politique et sociale au Cameroun." />
  <meta property="og:image" content="https://solitiquo.com/logo.png" />
  <meta property="og:url" content="https://solitiquo.com" />
  <meta property="og:type" content="website" />

    <link rel="alternate" hreflang="en" href="https://solitiquo.com/en/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://img.youtube.com" />
  <title>Studio Podcast — Solitiquo</title>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/pages/editeur-podcast.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@400;700&display=swap&subset=latin-ext"
    rel="stylesheet">

  <!-- Favicon & icônes app -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png">
  <link rel="icon" href="/favicon.ico">
  <!-- Apple / iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png">
  <meta name="apple-mobile-web-app-title" content="Solitiquo">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body id="page-editeur-podcast">

  <header class="premium-header">
    <div class="ph-left">
      <div class="burger-container">
        <button class="burger-btn" id="burgerBtn">
          <div class="burger-line"></div>
          <div class="burger-line"></div>
          <div class="burger-line"></div>
        </button>
      </div>

      <a href="index.html" class="ph-brand">
        <img src="logo.svg" alt="S">
        <div class="brand-sep"></div>
        <span class="brand-text">Solitiquo</span>
      </a>
    </div>

    <div class="ph-center">
      <nav class="ph-nav">
        <a href="politique.html" class="ph-link" data-i18n="nav_pol">Politique</a>
        <a href="social.html" class="ph-link" data-i18n="nav_soc">Social</a>
        <a href="partis-politiques.html" class="ph-link" data-i18n="nav_parties">Partis</a>
        <a href="emissions.html" class="ph-link" data-i18n="nav_shows">Émissions</a>
        <a href="podcasts.html" class="ph-link" data-i18n="nav_podcasts">Podcasts</a>
      </nav>
    </div>

    <div class="ph-right" style="justify-content: flex-end; gap: 20px;">
      <div class="lang-switch-container">
        <button class="lang-seg-btn active" data-lang="fr">FR</button>
        <button class="lang-seg-btn" data-lang="en">EN</button>
      </div>
      <div class="search-stack">
        <div class="search-row">
          <button class="search-btn" id="searchBtn" type="button" aria-label="Ouvrir la recherche">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="M21 21l-4.35-4.35" />
            </svg>
          </button>
          <span class="search-label" id="searchLabel">Rechercher</span>
        </div>

        <form class="search-container" id="searchContainer" action="recherche.html" method="GET">

          <input type="text" name="q" class="search-input" placeholder="Rechercher..." id="searchInput"
            autocomplete="off" required />

          <button class="search-submit" type="submit" aria-label="Lancer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>

        </form>
      </div>
      <a href="auth.html" class="ph-btn-auth" data-i18n="nav_login">S'identifier</a>
    </div>
  
      <button id="burgerSearchBtn" class="burger-search-btn" aria-label="Rechercher">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
      </button>
  </header>

  <form id="podcastForm" class="workspace">

    <aside class="toolbar-left">
      <button type="button" class="tool-btn" onclick="format('bold')" title="Gras"><b>B</b></button>
      <button type="button" class="tool-btn" onclick="format('italic')" title="Italique"><i>I</i></button>
      <div class="tool-separator"></div>
      <button type="button" class="tool-btn" onclick="format('removeFormat')" title="Nettoyer">✕</button>
    </aside>

    <div class="paper-zone">
      <div class="paper-sheet">
        <input type="text" id="title" placeholder="Titre de l'épisode..." required autocomplete="off">

        <span class="section-label">DESCRIPTION</span>
        <textarea id="description" rows="3" placeholder="Résumé de l'épisode..."></textarea>

        <span class="section-label">TRANSCRIPTION INTERACTIVE</span>
        <div id="transcript-editor" contenteditable="true">
          <p>Commencez à écrire la transcription...</p>
          <p><em>Utilisez le bouton ⏱️ à gauche pour insérer un timecode.</em></p>
        </div>
      </div>
    </div>

    <aside class="settings-right">
      <div class="settings-scroll">

        <h3 class="panel-title">MÉDIAS</h3>

        <div class="field-group">
          <label style="font-weight:600; font-size:0.85rem; margin-bottom:8px; display:block;">Fichier Audio
            (MP3)</label>
          <div class="upload-box" onclick="document.getElementById('audio_file').click()">
            <span class="upload-icon">🎙️</span>
            <span class="upload-hint">Choisir le fichier MP3</span>
            <span id="audio-name" class="file-name"></span>
          </div>
          <input type="file" id="audio_file" accept="audio/*" style="display:none;" required
            onchange="showFileName(this, 'audio-name')">
        </div>

        <div class="field-group">
          <label style="font-weight:600; font-size:0.85rem; margin-bottom:8px; display:block;">Pochette</label>
          <div class="upload-box" onclick="document.getElementById('image_file').click()"
            style="height:150px; display:flex; justify-content:center; align-items:center;">
            <img id="cover-preview" src="" alt="" loading="lazy">
            <div id="cover-placeholder">
              <span class="upload-icon">🖼️</span>
              <span class="upload-hint">Uploader une image</span>
            </div>
          </div>
          <input type="file" id="image_file" accept="image/*" style="display:none;" onchange="previewCoverFile(this)">

          <div style="text-align:center; margin: 10px 0; font-size:0.8rem; color:#999;">— OU —</div>

          <input type="url" id="image_url" class="sidebar-input" placeholder="https://..."
            oninput="previewCoverUrl(this.value)">
        </div>

        <h3 class="panel-title">CHAPITRAGE</h3>
        <div id="chapters-container" style="margin-bottom:15px;"></div>
        <button type="button" class="btn-add-chapter" onclick="addChapterRow()"
          style="width:100%; padding:8px; cursor:pointer;">+ Ajouter un chapitre</button>

        <h3 class="panel-title">DÉTAILS</h3>

        <div class="field-group">
          <select id="category" class="sidebar-input">
            <option>Politique</option>
            <option>Social</option>
            <option>Économie</option>
            <option>Culture</option>
            <option>Géopolitique</option>
          </select>
        </div>

      </div>

      <div class="settings-footer">
        <button type="submit" class="btn-publish">Mettre en ligne</button>
        <div id="status-msg"></div>
      </div>
    </aside>
  </form>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    (async function checkAccess() {
      await initLanguageSwitcher({ reloadPage: true });
      const user = await SolitiquoAPI.getProfile();
      if (!user || (user.role !== 'admin' && user.role !== 'writer')) {
        window.location.href = 'auth.html';
      }
    })();

    function format(cmd, val = null) { document.execCommand(cmd, false, val); }

    function addChapterRow(time = '00:00', title = '') {
      const div = document.createElement('div');
      div.className = 'chapter-item';
      div.innerHTML = `
        <input type="text" class="sidebar-input chap-time" value="${time}" placeholder="00:00">
        <input type="text" class="sidebar-input chap-title" value="${title}" placeholder="Titre">
        <button type="button" class="chap-del" onclick="this.parentElement.remove()">×</button>
    `;
      document.getElementById('chapters-container').appendChild(div);
    }
    // Initialisation
    addChapterRow('00:00', 'Intro');

    function showFileName(input, displayId) {
      if (input.files[0]) document.getElementById(displayId).textContent = input.files[0].name;
    }

    function previewCoverFile(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = document.getElementById('cover-preview');
          img.src = e.target.result; img.style.display = 'block';
          document.getElementById('cover-placeholder').style.display = 'none';
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function previewCoverUrl(url) {
      if (url) {
        const img = document.getElementById('cover-preview');
        img.src = url; img.style.display = 'block';
        document.getElementById('cover-placeholder').style.display = 'none';
        document.getElementById('image_file').value = '';
      }
    }

    document.getElementById('podcastForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.querySelector('.btn-publish');
      const msg = document.getElementById('status-msg');

      btn.textContent = 'Envoi en cours...';
      btn.disabled = true;
      msg.textContent = '';

      const chapters = [];
      document.querySelectorAll('.chapter-item').forEach(row => {
        chapters.push({
          time: row.querySelector('.chap-time').value,
          title: row.querySelector('.chap-title').value
        });
      });
      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('transcript', document.getElementById('transcript-editor').innerHTML);
      formData.append('category', document.getElementById('category').value);
      formData.append('author_id', 1);

      formData.append('audio_file', document.getElementById('audio_file').files[0]);
      formData.append('chapters', JSON.stringify(chapters)); // Ajout du JSON
      const imgFile = document.getElementById('image_file').files[0];
      const imgUrl = document.getElementById('image_url').value;

      if (imgFile) formData.append('image_file', imgFile);
      else if (imgUrl) formData.append('image_url', imgUrl); // Attention: Backend doit gérer ce champ (optionnel)

      try {
        const res = await fetch(`${window.API_URL}/podcasts`, { method: 'POST', body: formData });
        const json = await res.json();

        if (json.success) {
          msg.style.color = 'green'; msg.textContent = '✅ Podcast publié !';
          setTimeout(() => window.location.href = 'podcasts.html', 1500);
        } else { throw new Error(json.error); }
      } catch (err) {
        msg.style.color = 'red'; msg.textContent = 'Erreur: ' + err.message;
        btn.textContent = 'Mettre en ligne'; btn.disabled = false;
      }
    });
  </script>
  <script src="/js/lazyload.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>

</html>
